<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Dhanora Dynasty Resort</title>
    <style>
      :root {
        --oxblood: #441c1a;
        --gold: #c9a227;
        --ivory: #f7f2e7;
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        text-align: center;
        background: var(--oxblood);
        color: var(--ivory);
        font-family: "Inter", system-ui, -apple-system, sans-serif;
      }
      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.22em;
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--gold);
        margin-bottom: 1rem;
      }
      h1 {
        font-family: "Playfair Display", Georgia, serif;
        font-size: clamp(3rem, 12vw, 6rem);
        line-height: 1;
        margin-bottom: 1rem;
      }
      p {
        max-width: 32rem;
        margin: 0 auto 2rem;
        color: rgba(247, 242, 231, 0.85);
        line-height: 1.6;
      }
      a {
        display: inline-block;
        padding: 0.85rem 2.25rem;
        border-radius: 999px;
        background: var(--gold);
        color: var(--oxblood);
        font-weight: 600;
        text-decoration: none;
        transition: opacity 0.2s;
      }
      a:hover {
        opacity: 0.88;
      }
      .rule {
        width: 3rem;
        height: 1px;
        background: var(--gold);
        margin: 0 auto 2rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Dhanora Dynasty Resort</p>
      <h1>404</h1>
      <div class="rule"></div>
      <p>
        The page you are looking for could not be found. It may have been moved, or the link may be
        incorrect.
      </p>
      <a href="/">Return home</a>
    </main>
  </body>
</html>
